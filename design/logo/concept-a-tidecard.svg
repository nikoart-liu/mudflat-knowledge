  <path d="M 146 316 Q 173.5 300 201 316 T 256 316 T 311 316 T 366 316" fill="none" stroke="#23201c" stroke-width="9"/>
  <path d="M 146 352 Q 173.5 336 201 352 T 256 352 T 311 352 T 366 352" fill="none" stroke="#a9a49c" stroke-width="9"/>
  <path d="M 146 388 Q 173.5 372 201 388 T 256 388 T 311 388 T 366 388" fill="none" stroke="#c7c4bc" stroke-width="9"/>
