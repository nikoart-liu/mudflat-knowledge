name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows (x64)
            platform: windows-latest
            target: ""
            args: ""
          - name: Linux (x64)
            platform: ubuntu-22.04
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        run: >-
          node -e "const fs=require('node:fs'); const tauri=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')).version; const pkg=JSON.parse(fs.readFileSync('package.json','utf8')).version; const cargo=fs.readFileSync('src-tauri/Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m)?.[1]; const tag=process.env.GITHUB_REF_NAME; if (tauri!==pkg || tauri!==cargo || tag!=='v'+tauri) { console.error('Version mismatch: tag='+tag+', tauri='+tauri+', package='+pkg+', cargo='+cargo); process.exit(1); } console.log('Release version verified: '+tag);"

      - name: Build installers and publish release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 滩涂拾遗 ${{ github.ref_name }}
          releaseBody: 自动构建的 macOS、Windows 与 Linux 安装包。
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: mudflat-knowledge_[version]_[platform]_[arch][setup][ext]
          args: ${{ matrix.args }}
